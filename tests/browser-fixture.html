<!doctype html>
<html lang=zh-CN>
<head>
  <meta charset=utf-8>
  <title>DouyinVH Browser Fixture</title>
</head>
<body>
  <div id=screen-reader-status>读屏标签已关闭</div>

  <header>
    <nav>
      <button>推荐</button>
      <button>搜索</button>
      <input placeholder=搜索>
    </nav>
  </header>

  <div role=tablist>
    <div role=tab>生活vlog</div>
    <div role=tab>美妆穿搭</div>
  </div>

  <div id=following-badge>你的关注</div>
  <div id=co-create-badge>共创</div>

  <section id=player>
    <button>清屏</button>
    <button>连播</button>
  </section>

  <article>
    <p id=caption>推荐这条视频</p>
    <p id=exact-user-content>推荐</p>
    <p id=hashtag>#推荐</p>
  </article>

  <div id=dynamic></div>

  <script src=../douyin-vh.user.js?fixture=browser2></script>
  <script>
    setTimeout(() => {
      const button = document.createElement('button');
      button.textContent = '倍速';
      document.querySelector('#dynamic').append(button);
    }, 50);
  </script>
</body>
</html>
